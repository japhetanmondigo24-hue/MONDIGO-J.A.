<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Log-In Form</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    </head>
    <body>
            <img src="pokemon wallpaper starter.jpg" alt="wall">
        <div class="log-in_container">
          <form id="loginform">
            <h2>Trainer Log In</h2>
            <label for="gmail">Gmail</label>
            <input type="email" id="gmail" name="email" placeholder="Enter your Gmail, Trainer" required>
            <label id="gmailerror" class="error"></label> <br>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Please enter your Password" required>
            <small id="passworderror" class="error"></small><br>

            <button type="submit">Log In</button>
          </form>
        </div>
     <script src="script.js"></script>

    </body>
</html>
